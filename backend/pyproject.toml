[project]
name = "alexa"
version = "0.1.0"
description = "Deterministic rules and audit layer for Alexa+"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.150.0",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.15.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Depends in defaults is the form that survives `from __future__ import annotations`
# for dependencies built per app instance inside create_app().
"app/main.py" = ["B008"]
